name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Verify runs on PRs too, so a change is checked before it reaches master
  # rather than after. Build and deploy stay master-only — the github-pages
  # environment permits deployments from master alone, so a PR that reached
  # them would only ever fail at the environment gate.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The generator asserts every address is unique. Re-running it here means a
      # source-outline edit that introduces a collision fails CI instead of shipping.
      #
      # 07-map-legacy.py must run here too: it is the only thing that joins the
      # hand-authored division table to the outline, so an edit to divisions.json
      # that renames or drops a code leaves lookup.json pointing at a code that no
      # longer exists. Regenerating before the tests means they run on fresh data
      # rather than confirming a stale file agrees with itself.
      - name: Regenerate addresses and check for drift
        run: |
          cd context/scripts
          python3 01-number.py
          python3 05-emit-markdown.py
          python3 06-emit-hubs-json.py
          python3 07-map-legacy.py
          cd ../..
          if ! git diff --quiet -- context/data context/content; then
            echo "::error::Generated data is out of date. Run 'pnpm data' and commit the result."
            git diff --stat -- context/data context/content
            exit 1
          fi

      - name: Address grammar and division table tests
        run: node --test "src/lib/*.test.ts"

  build:
    name: Build
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: withastro/action@v6

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
